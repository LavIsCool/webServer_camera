<!DOCTYPE html>
<html>
    <head>
        <title>ESP32 Webserver</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
        <link rel="stylesheet" type="text/css" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="main">
            <h1>My Project</h1>
            <button class="button OFF red" id="btnred" onclick="toggleColor('red')">red</button>
            <button class="button OFF green" id="btngreen" onclick="toggleColor('green')">green</button>
            <button class="button OFF blue" id="btnblue" onclick="toggleColor('blue')">blue</button>
            <div class="temp">
                <p>Temperature: <span id="temperature"></span>C</p>
                <p>Humidity: <span id="humidity"></span>%</p>
            </div>
            <iframe src="http://192.168.4.50/cam" height="480px" width="640px"></iframe>
        </div>
    </body>
</html>
